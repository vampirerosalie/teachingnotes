  <style>
    :root{--font-factor:1;--ink:#26324a;--muted:#657087;--paper:#fffdfb;--line:#d8d2e4;--purple:#59477d;--plum:#7d4c76;--rose:#b66e82;--lav:#f3eff9;--mint:#edf9f3;--gold:#ffeaa2;--green:#287252;--shadow:0 14px 38px rgba(62,44,88,.17)}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9e4ef;color:var(--ink);font-family:Inter,"Segoe UI","Noto Sans SC","Microsoft YaHei",Arial,sans-serif}button{font:inherit}
    #toolbar{position:fixed;z-index:50;left:0;right:0;top:0;height:58px;padding:8px 14px;display:flex;align-items:center;gap:8px;background:rgba(57,43,79,.97);color:#fff;box-shadow:0 3px 16px rgba(0,0,0,.22);user-select:none}
    #toolbar .brand{font-weight:850;font-size:16px;white-space:nowrap;margin-right:auto}#toolbar button,#toolbar select{border:1px solid rgba(255,255,255,.25);border-radius:10px;background:#69548e;color:#fff;min-height:38px;padding:7px 11px;cursor:pointer;font-weight:750}#toolbar button:hover{background:#8068aa}#zoomReadout{min-width:54px;text-align:center;font-weight:850}
    #showToolbar{display:none;position:fixed;z-index:60;right:12px;top:10px;border:0;border-radius:999px;width:46px;height:46px;background:#59477d;color:#fff;font-size:22px;box-shadow:var(--shadow);cursor:pointer}
    #viewport{position:absolute;inset:58px 0 0;overflow:auto;overscroll-behavior:contain;background:radial-gradient(circle at 15% 10%,rgba(255,255,255,.95),transparent 25%),linear-gradient(145deg,#eee9f3,#ddd5e7);scroll-behavior:smooth;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom}
    #stage{position:relative;margin:24px auto 80px}#deck{width:1200px;transform-origin:0 0;position:absolute;left:0;top:0;font-size:calc(18px * var(--font-factor));line-height:1.54}

    .eyebrow{font-size:14px;text-transform:uppercase;letter-spacing:.15em;color:#8c557f;font-weight:900;margin-bottom:3px}h1{margin:0 0 10px;font-size:34px;line-height:1.18;color:#4d3d70}h2{margin:20px 0 10px;font-size:25px;color:#674563}h3{margin:0 0 8px;font-size:20px;color:#574276}p{margin:0 0 12px}
    .instructions{padding:10px 15px;border-left:5px solid #b56a8a;background:var(--lav);border-radius:7px;margin:0 0 18px}.question-grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}.qcard{border:1.5px solid var(--line);border-radius:15px;padding:18px;background:#fff;box-shadow:0 4px 12px rgba(58,45,77,.06)}.qnum{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--purple);color:#fff;font-weight:900;margin-right:8px}.prompt{font-weight:800;font-size:18px;margin:12px 0 8px}.option{margin:6px 0 6px 18px;padding-left:4px}
    .review-btn,.blank-btn,.choice-btn{border:0;border-radius:10px;background:var(--purple);color:#fff;padding:9px 14px;font-weight:800;cursor:pointer}.review-btn{margin-top:12px}.review-btn:hover,.blank-btn:hover,.choice-btn:hover{background:#7a629d}.review-btn[aria-expanded="true"]{background:var(--green)}.reveal{display:none;margin-top:12px;padding:12px 14px;border:1px solid #a5d7bd;border-radius:11px;background:var(--mint);color:#174b36}.reveal.show{display:block;animation:pop .22s ease-out}.answer{font-weight:900;color:#075f3a}.cn-explain{display:block;margin-top:5px;font-family:"KaiTi","STKaiti","Noto Serif SC",serif;color:#8d4a2e;font-weight:650}@keyframes pop{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
    .evidence.on{background:var(--gold);box-shadow:0 0 0 3px var(--gold);border-radius:3px;color:#563700}.vocab{font-weight:760;color:#694679;border-bottom:1px dotted #9d6a99}.vocab::after{content:"（" attr(data-cn) "）";font-family:"KaiTi","STKaiti","Noto Serif SC",serif;font-weight:650;color:#9a4e28;font-size:.82em}
    .columns{display:grid;grid-template-columns:1.08fr .92fr;gap:22px;align-items:start}.passage{border:1.5px solid #d1c6dc;border-radius:15px;padding:20px 22px;background:#fff;line-height:1.72}.passage p{margin-bottom:14px}.compact-list{display:grid;gap:9px}.mini-q{border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff}.mini-q .prompt{margin:0 0 6px;font-size:17px}.answer-line{display:inline-block;min-width:180px;border-bottom:2px solid #767086;height:24px;vertical-align:bottom}.error-word{font-weight:850;text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:#9e3e5a;cursor:pointer}.error-word.part2-active{background:var(--gold);box-shadow:0 0 0 3px var(--gold);border-radius:3px;color:#563700}.part2-feedback{display:block;margin:10px 0 14px}.correction-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.correction-grid .mini-q{min-height:124px}
    .gap{display:inline-flex;align-items:center;gap:6px}.blank-btn{padding:3px 11px;border-radius:7px;background:#f5eff9;color:#5a4174;border:2px dashed #8d6697}.option-drawer{display:none;margin:10px 0 14px;padding:13px;border-radius:12px;background:#faf7fc;border:1px solid #d7c9df}.option-drawer.show{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice-btn{display:block;width:100%;text-align:left;background:#fff;color:#3f3451;border:1px solid #ddd1e5;padding:8px 10px}.choice-btn.correct{background:#e4f5ea;border-color:#60a879;color:#195a38}.choice-btn.wrong{background:#fff0f0;border-color:#d78b8b;color:#8b3333}.feedback{grid-column:1/-1;display:none;padding:11px 13px;border-radius:10px;font-weight:800}.feedback.show{display:block}.feedback.correct{background:var(--mint);border:1px solid #a5d7bd;color:#174b36}.feedback.wrong{background:#fff0f0;border:1px solid #d78b8b;color:#8b3333}
    .note-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.note-card{border-radius:14px;padding:17px 18px;background:#faf7fc;border:1px solid #dacde2}.formula{display:inline-block;margin:5px 0;padding:5px 10px;border-radius:8px;background:#fff0bc;color:#633d00;font-weight:900}.example{color:#5f5870}.key-note{margin-top:18px;border-radius:14px;padding:15px 18px;background:#fff5cf;border:1px solid #ebce63}
    table{width:100%;border-collapse:collapse;background:#fff}th,td{border:1px solid #d2c7dc;padding:12px 13px;vertical-align:top;text-align:left}th{background:#59477d;color:#fff}td.cn{font-family:"KaiTi","STKaiti","Noto Serif SC",serif;color:#8a4628;font-weight:700}.page-index{position:absolute;right:25px;bottom:14px;font-size:13px;color:#887f93;letter-spacing:.08em;font-weight:800}
    .toast{position:fixed;z-index:70;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#4d3d70;color:white;padding:11px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media(max-width:760px){#toolbar .brand{display:none}#toolbar{gap:4px;padding:7px 8px}#toolbar button,#toolbar select{padding:6px 8px;min-height:36px}}

  <script>
    const part1=[
      {n:1,text:`A maritime museum uses artificial intelligence to recreate the voice of a nineteenth-century explorer. Visitors are told that the voice is synthetic. A historian later points out that <span class="evidence" id="p1e1a">several sentences in the narration were written by the museum to connect gaps in the explorer's letters rather than taken from his own words</span>. The museum keeps the exhibit but <span class="evidence" id="p1e1b">adds the phrase “interpretive reconstruction” to its label</span>.`,q:`Which concern is still most difficult to remove completely?`,opts:[`A. The digital voice may sound less emotional than a real recording.`,`B. The additional label may make the exhibit less entertaining for visitors.`,`C. The display may blur the boundary between documented evidence and creative interpretation.`],ans:`C`,why:`The label admits interpretation, but invented linking sentences are still presented through the explorer's recreated voice. The boundary between evidence and creative reconstruction remains unclear.`,cn:`标签虽有说明，但虚构连接句仍借探险家的声音呈现，所以史料与创作之间的界线仍可能模糊。`,ev:['p1e1a','p1e1b']},
      {n:2,text:`A hotel video went viral after an elevator briefly displayed “13” even though guests could not select a thirteenth floor. <span class="evidence" id="p1e2a">An engineer explained that the control system still uses the number internally and that a software fault had placed the display in maintenance mode.</span> The hotel repaired the fault, but later <span class="evidence" id="p1e2b">framed a screenshot of the “ghost floor” in its lobby because visitors kept asking about it</span>.`,q:`What best characterises the hotel's response?`,opts:[`A. It treats the continued popularity of the story as proof that the technical explanation is incomplete.`,`B. It separates the probable cause of the incident from the way the incident is presented to visitors.`,`C. It uses the engineer's explanation mainly to discourage guests from discussing the story.`],ans:`B`,why:`The hotel accepts and fixes the technical cause, yet it also turns the story into a playful visitor attraction. Cause and presentation are treated separately.`,cn:`酒店接受技术解释并修复故障，同时又把“鬼楼层”当作趣味展示；原因与宣传方式被分开处理。`,ev:['p1e2a','p1e2b']},
      {n:3,text:`A cropped screenshot spread through a school group chat and appeared to show a teacher mocking a student. <span class="evidence" id="p1e3a">When the full conversation was released, it became clear that the teacher had been quoting the student's own joke.</span> The school cleared the teacher of the accusation but <span class="evidence" id="p1e3b">still disciplined the student who had posted the private messages without permission</span>.`,q:`What distinction is the school making?`,opts:[`A. Whether the accusation was accurate and whether sharing the messages was appropriate are separate issues.`,`B. A joke can be acceptable in private even when it becomes offensive in public.`,`C. The student's intention matters more than the consequences of posting the screenshot.`],ans:`A`,why:`The accusation was shown to be false, but posting private messages without permission was still misconduct. Accuracy and privacy are separate questions.`,cn:`指控不属实，并不表示泄露私人信息是正确的；真实性与分享行为是否恰当是两个不同问题。`,ev:['p1e3a','p1e3b']},
      {n:4,text:`During a horror attraction, a visitor panicked at a harmless moving figure, ran towards the exit and fell on a narrow turn. <span class="evidence" id="p1e4">The organisers did not remove the figure. Instead, they widened the route, improved the lighting near the exit and kept the same level of scare inside the attraction.</span>`,q:`What does the organisers' decision suggest?`,opts:[`A. The attraction became safer only because visitors could now see the frightening figure more clearly.`,`B. The organisers believed warnings would be more effective than changing the physical environment.`,`C. Real injury can result from a perceived threat even when the frightening object itself is harmless.`],ans:`C`,why:`The figure was harmless, but panic caused unsafe movement and a real fall. The organisers therefore changed the physical escape route, not the scare itself.`,cn:`可怕物体本身无害，但恐慌仍会导致真实受伤，所以他们改善逃生路线而保留惊吓效果。`,ev:['p1e4']},
      {n:5,text:`A fake audio message imitating the principal's voice announced that school would close because of a water problem. <span class="evidence" id="p1e5a">The message was exposed within an hour.</span> A week later, the principal released a genuine emergency recording during a flash flood, but <span class="evidence" id="p1e5b">several students initially ignored it because they assumed it was another imitation</span>.`,q:`What wider problem is illustrated by the two incidents together?`,opts:[`A. Emergency information becomes unreliable whenever it is delivered by audio rather than text.`,`B. A convincing false message can weaken trust in later information that is genuine.`,`C. Students are more likely to believe a fake message when it concerns an ordinary school problem.`],ans:`B`,why:`The first fake message damaged trust, so some students dismissed the later genuine warning. False information can reduce confidence in real information.`,cn:`第一次假消息破坏了信任，导致部分学生连后来的真实警告也不相信。`,ev:['p1e5a','p1e5b']},
      {n:6,text:`A technology reviewer writes, “This video is not sponsored,” and explains that <span class="evidence" id="p1e6a">she bought the headphones with her own money</span>. In the description, however, <span class="evidence" id="p1e6b">she includes a special purchase link that pays her a small commission whenever a viewer buys the product</span>. Her review praises the sound quality but also mentions two weaknesses.`,q:`Which evaluation of the review is most reasonable?`,opts:[`A. The product was obtained independently, although the reviewer still has a financial interest in purchases made through her link.`,`B. Because the reviewer paid for the product, the commission cannot influence how readers should judge the review.`,`C. Mentioning weaknesses demonstrates that the purchase link has no relevance to the reviewer's judgement.`],ans:`A`,why:`Buying the product independently supports one kind of independence, but earning commission still creates a financial interest. Both facts must be considered.`,cn:`她自行购买产品，但销售佣金仍构成经济利益；评价时必须同时考虑这两点。`,ev:['p1e6a','p1e6b']},
      {n:7,text:`A panoramic photograph taken at a night market appeared to show the same woman standing in two different places at once. The photographer first posted it as a “strange mystery”. Later, <span class="evidence" id="p1e7">another image showed the woman walking across the scene while the phone was slowly capturing the panorama from left to right</span>.`,q:`What is the strongest conclusion from the sequence of images?`,opts:[`A. Unusual photographs are usually caused by people moving too quickly for cameras.`,`B. The photographer's original description was dishonest because a second image explained the effect.`,`C. A single image can be misleading when the way it was produced is ignored.`],ans:`C`,why:`The second image explains how the panorama captured the moving woman twice. The production process changes how the first image should be interpreted.`,cn:`第二张照片解释了全景拍摄如何重复捕捉移动中的人物；忽略制作过程会误读单张照片。`,ev:['p1e7']},
      {n:8,text:`An escape-room company removed the large countdown clock from one room after players complained that it made them panic. Without the clock, <span class="evidence" id="p1e8a">teams reported feeling calmer and took about six minutes longer on average</span>, but <span class="evidence" id="p1e8b">the percentage of groups that escaped successfully stayed almost the same</span>. The company later added a smaller clock near the final door.`,q:`What trade-off did the experiment reveal?`,opts:[`A. Removing the clock reduced pressure but also made fewer teams complete the room.`,`B. Lower visible pressure changed how quickly teams worked more than whether they eventually succeeded.`,`C. The countdown improved performance even though players disliked seeing it.`],ans:`B`,why:`Teams became slower but not less successful. The clock mainly affected speed and pressure, not the final success rate.`,cn:`没有大时钟时，队伍更慢却不更容易失败；它主要影响速度与压力，而非最终成功率。`,ev:['p1e8a','p1e8b']}
    ];
    const corrections=[
      [9,'gone','After “had never”, use the past participle: go - went - gone.','“had never” 后用过去分词 gone。'],[10,'arrived','The tour is narrated in the past, so use past simple.','叙述过去发生的事，用 arrived。'],[11,'were','The plural subject “some parts” takes “were”.','主语 some parts 是复数，用 were。'],[12,'seen','After “had already”, use the past participle: see - saw - seen.','“had already” 后用过去分词 seen。'],[13,'who','Use “who” for people.','指人时用 who。'],[14,'distorted','After “appear slightly”, an adjective is needed.','appear 后需要形容词 distorted。'],[15,'boring','After “rather than”, the adjective must match “interesting”.','与形容词 interesting 对应，应使用 boring。'],[16,'assumed','The event happened in the past.','事件发生在过去，用 assumed。'],[17,'switched','In the time clause, the unit “switched on”.','表示机器开启，用过去式 switched on。'],[18,'to believe','The pattern is “refuse to + base verb”.','固定结构 refuse to do。'],[19,'rejecting','After “mean” in this sense, use a gerund.','mean 表示“意味着”时，后接动名词。'],[20,'deciding','After the preposition “before”, use a gerund here.','介词 before 后用 deciding。'],[21,'significant','“Seem” is followed by an adjective.','seem 后用形容词 significant。'],[22,'ignoring','“While” links parallel actions: paying attention / ignoring.','与 pay attention 构成平行结构，用 ignoring。'],[23,'imagined','After “had”, use the past participle.','had 后用过去分词 imagined。'],[24,'learn','The pattern is “would rather + base verb”.','would rather 后用原形 learn。'],[25,'was','The singular subject “every story” takes “was”.','every story 是单数，用 was。'],[26,'have become','“Since then” connects past change to the present; use present perfect.','Since then 表示从过去持续到现在，用现在完成时。'],[27,'verified','After “has been”, use a past participle to form the passive.','has been 后用过去分词构成被动语态。'],[28,'help','The plural subject “Those habits” takes the base verb.','Those habits 是复数主语，用 help。']
    ];
    const p3qs=[
      [29,'Urban setting of the outbreak','Strasbourg','p3e29','The first paragraph names Strasbourg as the street location.','第一段指出事件发生在 Strasbourg。'],[30,'Earliest known participant','Frau Troffea','p3e30','She is identified as the woman who began dancing first.','她是最早开始跳舞的人。'],[31,"Length of the first dancer's episode",'nearly a week','p3e31','The text says she continued for nearly a week.','文中直接说明她持续了 nearly a week。'],[32,'Highest estimated number involved','about 400','p3e32','By August, the number may have reached about 400.','到八月人数可能达到约 400。'],[33,'Medical explanation used at the time','hot blood','p3e33','Local physicians blamed a condition called “hot blood”.','当时医生归因于所谓的 hot blood。'],[34,'Structure provided by the authorities','stage','p3e34','The city authorities built a stage.','市政当局搭建了舞台。'],[35,'Physical result experienced by many','exhaustion','p3e35','Many participants collapsed from exhaustion.','许多人因精疲力尽而倒下。'],[36,'Month in which officials changed strategy','September','p3e36','The new approach began by September.','官方在九月改变处理方法。'],[37,'Religious destination of the remaining dancers','mountaintop shrine','p3e37','They were taken to a mountaintop shrine linked to St Vitus.','剩余舞者被带到山顶神殿。'],[38,'Hardships linked to the stress theory','disease and famine','p3e38','These two hardships are explicitly linked to social stress.','疾病与饥荒被直接联系到社会压力。']
    ];
    const p4qs=[
      [39,'The area most closely associated with the 2015 earthquake was ______.','Ranau','p4e39','The opening sentence says the earthquake struck the Ranau area.','开头说明地震袭击 Ranau 一带。'],[40,'The shaking was measured at ______.','magnitude 6.0','p4e40','This is the stated magnitude.','文中直接给出震级。'],[41,'Four of those who lost their lives worked as ______.','mountain guides','p4e41','Four victims were mountain guides.','四名遇难者是登山向导。'],[42,'Damage to the mountain later led to the construction of ______.','new climbing trails','p4e42','Sabah Parks rebuilt new climbing trails.','Sabah Parks 后来重建新的登山路径。'],[43,'Emergency teams now rehearse their response through ______.','search and rescue simulation training','p4e43','This training is the stated form of emergency rehearsal.','这种训练就是应急演练方式。'],[44,'Procedures for organising climbs were strengthened through a more thorough ______.','standard operating procedure','p4e44','The procedure was made more thorough.','登山管理的标准作业程序被加强。'],[45,'Present-day climbers must use the services of a ______.','registered mountain guide','p4e45','Current park rules require this.','现行公园规定要求聘请注册登山向导。'],[46,"Sabah's greater earthquake exposure is connected to nearby ______.",'active tectonic zones','p4e46','Its position near active tectonic zones explains the risk.','邻近活跃构造带解释了较高风险。'],[47,'pushed something to develop or improve more quickly','propelled','p4e47','“Propelled” means pushed something forward or faster.','propelled 表示推动某事更快发展。'],[48,'official rules controlling how an activity is carried out','regulations','p4e48','“Regulations” are official controlling rules.','regulations 指管理活动的正式规则。']

    const p2=`<h2>I Spent Midnight in a Haunted Museum</h2><p>During the school holidays, my cousin persuaded me to join a midnight museum tour that promised to explain several local ghost stories. I had never (9) <span class="error-word evidence" id="p2e9">went</span> on anything similar before, so I expected the experience to be frightening. When we (10) <span class="error-word evidence" id="p2e10">arrives</span>, the guide reminded everyone not to wander away from the group because some parts of the old building (11) <span class="error-word evidence" id="p2e11">was</span> under repair.</p><p>The first room contained an antique mirror that visitors often claimed showed an extra person. A woman beside me whispered that she had already (12) <span class="error-word evidence" id="p2e12">saw</span> a pale face in it. I looked carefully but could only see reflections from people (13) <span class="error-word evidence" id="p2e13">which</span> were standing behind us. The guide explained that the uneven glass could make faces appear slightly (14) <span class="error-word evidence" id="p2e14">distortion</span>. Surprisingly, this explanation made the mirror more interesting rather than (15) <span class="error-word evidence" id="p2e15">boringly</span>.</p><p>Later, we heard three knocks from an empty corridor. Several visitors immediately (16) <span class="error-word evidence" id="p2e16">assumes</span> that someone was hiding there. The guide asked us to wait silently, and the sound happened again. This time, we noticed that it appeared whenever an old air-conditioning unit (17) <span class="error-word evidence" id="p2e17">switch</span> on. One boy still refused (18) <span class="error-word evidence" id="p2e18">believing</span> the explanation because he said the timing was too perfect to be a coincidence.</p><p>By the end of the tour, I realised that being sceptical does not mean (19) <span class="error-word evidence" id="p2e19">reject</span> every unusual experience. It means looking for more than one explanation before (20) <span class="error-word evidence" id="p2e20">decide</span> what happened. I also learned that fear can make ordinary details seem (21) <span class="error-word evidence" id="p2e21">significance</span>. When people expect something strange, they may pay attention to evidence that supports the story while (22) <span class="error-word evidence" id="p2e22">ignore</span> details that do not.</p><p>My cousin, who had been the most nervous at the beginning, eventually admitted that the tour was less terrifying than she had (23) <span class="error-word evidence" id="p2e23">imagine</span>. She said she would rather (24) <span class="error-word evidence" id="p2e24">learning</span> how a mystery works than simply be told that it is fake. I agreed. The best part of the night was not proving that every story (25) <span class="error-word evidence" id="p2e25">were</span> false, but discovering how easily our minds can create a convincing explanation from incomplete information. Since then, I (26) <span class="error-word evidence" id="p2e26">became</span> more careful about dramatic videos online. I now check who posted them, what happened before the recording started, and whether the claim has been (27) <span class="error-word evidence" id="p2e27">verify</span> elsewhere. Those habits (28) <span class="error-word evidence" id="p2e28">helps</span> me enjoy a mystery without believing it too quickly.</p>`;

    const p3=`<h2>The Dancing Plague of 1518</h2><p>In July 1518, a woman later identified as <span class="evidence" id="p3e30">Frau Troffea</span> stepped into a street in <span class="evidence" id="p3e29">Strasbourg</span> and began to dance. Historical accounts say that she continued for <span class="evidence" id="p3e31">nearly a week</span>. Before long, dozens of other residents joined her, and by August the number involved may have reached <span class="evidence" id="p3e32">about 400</span>.</p><p>Local physicians did not describe the problem as an injury or an infection. They blamed a condition they called <span class="evidence" id="p3e33">“hot blood”</span> and advised that the dancers should continue moving until the illness passed. City authorities therefore built a <span class="evidence" id="p3e34">stage</span> and even hired musicians. Instead of bringing the episode to an end, the organised dancing appears to have made the situation worse. Many participants collapsed from <span class="evidence" id="p3e35">exhaustion</span>.</p><p>By <span class="evidence" id="p3e36">September</span>, officials changed their approach. The remaining dancers were taken to a <span class="evidence" id="p3e37">mountaintop shrine</span> associated with St Vitus, where religious rituals were performed. The outbreak ended soon afterwards.</p><p>Historians still debate what caused the event. Ergot poisoning has been suggested, but some researchers argue that it does not explain the prolonged group behaviour well. Another explanation focuses on extreme social stress. At the time, people in the region had been facing <span class="evidence" id="p3e38">disease and famine</span>, while many also believed that St Vitus could punish people with uncontrollable dancing.</p>`;

    const p4=`<h2>When Mount Kinabalu Shook</h2><p>On 5 June 2015, a <span class="evidence" id="p4e40">magnitude 6.0</span> earthquake struck the <span class="evidence" id="p4e39">Ranau</span> area of Sabah. Tremors were strongly felt around Mount Kinabalu, where the shaking triggered rockfalls and damaged climbing routes and facilities. The disaster claimed 18 lives, including four <span class="evidence" id="p4e41">mountain guides</span>.</p><p>The event was especially significant because Sabah is the Malaysian state most exposed to earthquake risk. According to the Malaysian Meteorological Department, this is related to the state's position near <span class="evidence" id="p4e46">active tectonic zones</span> in the Philippines and Indonesia. The mountain itself could not simply return to normal after the shaking stopped because some routes and structures had been physically altered.</p><p>Climbing activities were suspended while the damage was assessed. Sabah Parks later rebuilt <span class="evidence" id="p4e42">new climbing trails</span>, improved accommodation and strengthened emergency preparation. Officials said the earthquake <span class="evidence" id="p4e47">propelled</span> them to improve safety. These changes included <span class="evidence" id="p4e43">search and rescue simulation training</span> and a more thorough <span class="evidence" id="p4e44">standard operating procedure</span> for managing climbs.</p><p>The role of guides also remained important. Current park <span class="evidence" id="p4e48">regulations</span> require climbers to engage a <span class="evidence" id="p4e45">registered mountain guide</span>. Guides cannot prevent an earthquake, but they can help groups follow approved routes, respond to changing conditions and act more quickly when something goes wrong.</p><p>The lesson from the disaster is not that all mountain risk can be removed. Instead, it shows how a serious event can expose weaknesses in a system and lead to better preparation. Safer paths, trained guides, rehearsed rescue plans and clearer procedures cannot control the earth itself, but they can reduce the consequences when conditions suddenly change.</p>`;

    page('Part 5: Gapped Text · Questions 49–54','Paper 1 · Reading and Use of English',`<div class="instructions">Tap a blank to open sentences A–H. Click an option to see whether it is correct or wrong. If it is wrong, try again.</div><div class="passage"><h2>Why We See a Face Where There Is None</h2><p>A face can seem to appear in burnt toast, the front of a car or a dark window. This tendency is known as pareidolia. The human brain is extremely fast at detecting socially important patterns, especially faces. That speed was probably useful because noticing another person quickly could matter for survival. ${gap(49)} This trade-off helps explain why an uncertain shape sometimes receives a very familiar interpretation.</p><p>Poor lighting makes the effect stronger because the brain has less detail to work with. It fills in missing information by using expectation and previous experience. Someone who has already been told that an old house is haunted may examine a window differently from someone who has heard nothing about it. ${gap(50)} The pattern itself has not changed; the interpretation has.</p><p>Emotional state matters as well. Fear, tiredness and anxiety can all affect what people notice first. In experiments, anxious participants are sometimes more likely to interpret uncertain images as threatening. ${gap(51)} Two people can therefore look at the same mark and disagree without either person deliberately lying.</p><p>Online sharing can strengthen the effect. A photograph may be cropped, enlarged and reposted until the original scale, angle and surrounding objects are difficult to judge. ${gap(52)} A tiny reflection can begin to look like a separate figure simply because the clues that once explained it are no longer visible.</p><p>Experiencing pareidolia does not mean that a person is foolish. Artists, scientists and careful observers can all experience it. The problem begins when the first impression is treated as proof rather than as one possible interpretation. ${gap(53)} Looking for competing explanations is therefore part of careful reasoning.</p><p>A useful test is to return to the original image, compare other photographs, change the viewing angle or examine the same place under different lighting. ${gap(54)} If the mysterious shape disappears as soon as the viewpoint changes, the puzzle may reveal more about perception than about the object itself.</p></div>`);

    page('Grammar Focus: Gerunds and Infinitives','Grammar Focus',`<div class="instructions">Different verb patterns can change both grammar and meaning. 中文重点：注意动名词 <strong>verb-ing</strong> 与不定词 <strong>to + verb</strong> 的固定搭配及意义变化。</div><div class="note-grid"><div class="note-card"><h3>1. Verb + gerund (-ing)</h3><div class="formula">avoid / consider / enjoy / finish / mind / suggest + -ing</div><div class="example">The guide suggested checking the original photograph.</div></div><div class="note-card"><h3>2. Verb + to-infinitive</h3><div class="formula">decide / hope / plan / promise / refuse / want + to do</div><div class="example">We decided to compare the two reports.</div></div><div class="note-card"><h3>3. Verb + object + to-infinitive</h3><div class="formula">advise / encourage / remind / tell / warn + person + to do</div><div class="example">The guard warned us not to enter the closed room.</div></div><div class="note-card"><h3>4. stop doing / stop to do</h3><div class="formula">stop doing = end an activity<br>stop to do = pause to do another activity</div><div class="example">He stopped talking. / He stopped to answer the phone.</div></div><div class="note-card"><h3>5. remember / forget</h3><div class="formula">remember doing = recall an experience<br>remember to do = do not forget a task</div><div class="example">I remember meeting her. / Remember to call her.</div></div><div class="note-card"><h3>6. try doing / try to do</h3><div class="formula">try doing = test a solution<br>try to do = make an effort</div><div class="example">Try restarting it. / I tried to contact him.</div></div><div class="note-card"><h3>7. regret doing / regret to say</h3><div class="formula">regret doing = feel sorry about a past action<br>regret to say = formal bad news</div><div class="example">I regret sharing it. / I regret to say that we are closed.</div></div><div class="note-card"><h3>Quick pattern reminder</h3><div class="formula">preposition + -ing</div><div class="example">before deciding · instead of guessing · without checking</div></div></div>`);

    function addTranslations(){
      const pairs=[...glossary].sort((a,b)=>b[0].length-a[0].length);
      document.querySelectorAll('.passage p,.qcard,.mini-q .prompt,.instructions,.note-card,.mini-q>.prompt').forEach(root=>{
        const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];
        while(walker.nextNode())nodes.push(walker.currentNode);
        nodes.forEach(node=>{
          if(node.parentElement.closest('.vocab,.reveal,button'))return;
          let parts=[node.nodeValue],changed=false;
          pairs.forEach(([word,cn])=>{
            parts=parts.flatMap(part=>{
              if(typeof part!=='string')return[part];
              const escaped=word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
              const re=new RegExp(`\\b(${escaped})\\b`,'gi');
              const split=part.split(re);
              if(split.length===1)return[part];
              changed=true;
              return split.map(piece=>piece.toLowerCase()===word.toLowerCase()?{word:piece,cn}:piece)
            })
          });
          if(!changed)return;
          const frag=document.createDocumentFragment();
          parts.forEach(part=>{
            if(typeof part==='string')frag.appendChild(document.createTextNode(part));
            else{const s=document.createElement('span');s.className='vocab';s.dataset.cn=part.cn;s.textContent=part.word;frag.appendChild(s)}
          });
          node.replaceWith(frag)
        })
      })
    }
    addTranslations();

    document.addEventListener('click',e=>{
      const b=e.target.closest('.review-btn');
      if(b){
        const t=document.getElementById(b.dataset.target),open=!t.classList.contains('show');
        t.classList.toggle('show',open);b.setAttribute('aria-expanded',String(open));b.textContent=open?'Hide Answer':'Review Answer';
        (b.dataset.evidence||'').split(',').filter(Boolean).forEach(id=>document.getElementById(id)?.classList.toggle('on',open));
        if(open)t.scrollIntoView({behavior:'smooth',block:'nearest'})
      }

      const word=e.target.closest('.error-word[id^="p2e"]');
      if(word){
        const num=word.id.replace('p2e',''),item=correctionMap[num],existing=document.querySelector(`.part2-feedback[data-for="${num}"]`);
        document.querySelectorAll('.part2-feedback').forEach(el=>el.remove());
        document.querySelectorAll('.error-word.part2-active').forEach(el=>el.classList.remove('part2-active','on'));
        if(!existing&&item){
          const box=document.createElement('div');
          box.className='part2-feedback reveal show';box.dataset.for=num;
          box.innerHTML=`<span class="answer">(${num}) ${item.answer}</span><br>${item.why}<span class="cn-explain">${item.cn}</span>`;
          word.closest('p')?.insertAdjacentElement('afterend',box);
          word.classList.add('part2-active','on');
          box.scrollIntoView({behavior:'smooth',block:'nearest'})
        }
      }

      const blank=e.target.closest('.blank-btn');
      if(blank){
        const p=document.getElementById(blank.dataset.options);
        p.classList.toggle('show');blank.setAttribute('aria-expanded',String(p.classList.contains('show')))
      }

      const choice=e.target.closest('.choice-btn');
      if(choice){
        const n=choice.dataset.gap,correct=gaps[n][0],why=gaps[n][1],cn=gaps[n][2],box=document.getElementById(`feedback-${n}`),blankBtn=document.getElementById(`p5e${n}`);
        choice.closest('.option-drawer').querySelectorAll('.choice-btn').forEach(x=>x.classList.remove('correct','wrong'));
        if(choice.dataset.choice===correct){
          choice.classList.add('correct');
          box.className='feedback show correct';
          box.innerHTML=`<span class="answer">Correct ✓ — ${correct}</span><br>${why}<span class="cn-explain">${cn}</span>`;
          blankBtn?.classList.add('on')
        }else{
          choice.classList.add('wrong');
          box.className='feedback show wrong';
          box.innerHTML='<span class="answer">Wrong.</span><br>Try again.<span class="cn-explain">不正确，再试一次。</span>';
          blankBtn?.classList.remove('on')
        }
      }
    });


    const viewport=document.getElementById('viewport'),stage=document.getElementById('stage');
    const toolbar=document.getElementById('toolbar'),showToolbar=document.getElementById('showToolbar');
    const pages=[...document.querySelectorAll('.page')],select=document.getElementById('pageSelect');
    let scale=1,textPx=18,current=0;
    pages.forEach((p,i)=>select.add(new Option(`${i+1}. ${p.dataset.title}`,String(i))));
    function sizeStage(){
      stage.style.width=(1200*scale)+'px';stage.style.height=(deck.scrollHeight*scale)+'px';
      deck.style.transform=`scale(${scale})`;
    }
    function refreshViewportTop(){
      viewport.style.top=(document.body.classList.contains('presentation-mode')||toolbar.style.display==='none')?'0':(toolbar.getBoundingClientRect().height+'px');
    }
    function scaleToFit(){
      const initial=Math.min(1,(viewport.clientWidth-26)/1200);
      scale=initial;sizeStage();
      viewport.scrollLeft=0;
    }
    function changeText(delta){
      textPx=Math.max(14,Math.min(44,textPx+delta));
      document.documentElement.style.setProperty('--font-factor',(textPx/18).toFixed(4));
      document.getElementById('zoomReadout').textContent=textPx+'px';
      requestAnimationFrame(sizeStage);
    }
    function go(i){
      current=Math.max(0,Math.min(pages.length-1,Number(i)));
      select.value=String(current);
      viewport.scrollTo({top:pages[current].offsetTop*scale,left:0,behavior:'auto'});
    }
    document.getElementById('zoomIn').onclick=()=>changeText(2);
    document.getElementById('zoomOut').onclick=()=>changeText(-2);
    document.getElementById('prevBtn').onclick=()=>go(current-1);
    document.getElementById('nextBtn').onclick=()=>go(current+1);
    select.onchange=()=>go(select.value);
    function togglePresentation(){
      const on=document.body.classList.toggle('presentation-mode');
      refreshViewportTop();sizeStage();
      document.getElementById('fullScreen').textContent=on?'Exit Full Screen':'Full Screen';
    }
    document.getElementById('fullScreen').onclick=togglePresentation;
    document.getElementById('exitPresentation').onclick=togglePresentation;
    document.getElementById('hideToolbar').onclick=()=>{
      toolbar.style.display='none';showToolbar.style.display='block';refreshViewportTop();sizeStage();
    };
    showToolbar.onclick=()=>{
      toolbar.style.display='flex';showToolbar.style.display='none';refreshViewportTop();sizeStage();
    };
    // Native iPad Safari handles drag, scrolling and pinch; no pointer capture.
    document.addEventListener('keydown',e=>{
      if(e.key==='ArrowRight')go(current+1);
      if(e.key==='ArrowLeft')go(current-1);
      if(e.key==='Escape'&&document.body.classList.contains('presentation-mode'))togglePresentation();
    });
    new ResizeObserver(sizeStage).observe(deck);
    new ResizeObserver(()=>{refreshViewportTop();sizeStage()}).observe(toolbar);
    window.addEventListener('resize',()=>{refreshViewportTop();sizeStage()});
    changeText(0);refreshViewportTop();scaleToFit();go(0);
    window.deckCheck=()=>({pages:pages.length,part2:document.querySelectorAll('.error-word').length,gaps:document.querySelectorAll('.blank-btn').length,wordSize:textPx,scale,firstPage:pages[0]?.dataset.title});
  </script>
