name: Publish teaching notes
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript
        run: npm run check
      - name: Test iPad finger and Pencil annotations on current deck formats
        run: |
          npm ci --no-audit --no-fund --ignore-scripts --silent
          npm run test:annotations
      - name: Add Form 3 January practice PDF and listening audio
        run: |
          python3 -m pip install --quiet gdown==5.2.0
          python3 scripts/fetch_form3_january_assets.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
